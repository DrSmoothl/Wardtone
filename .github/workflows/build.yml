name: Build desktop apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            package: package:win
          - platform: macos
            arch: arm64
            runner: macos-latest
            package: package:mac
          - platform: macos
            arch: x64
            runner: macos-26-intel
            package: package:mac:intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record runner and toolchain
        run: node scripts/ci-environment.ts

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile=.test-runs/ci/results.xml

      - name: Build and package
        run: npm run ${{ matrix.package }}

      - name: Upload installers and archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Wardtone-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .test-runs/ci/
            release/builder-debug.yml
            release/builder-effective-config.yaml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
